name: Snappilot
options:
  bundleIdPrefix: ai.snappilot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SnapCore:
    path: .

targets:
  Snappilot:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: SnapCore
        product: SnapCore
    info:
      path: App/Info.plist
      properties:
        # "Open With" / drag onto the Dock icon for files already on the Mac (issue #1).
        # Alternate rank: offered in Open With, never taking over the user's default app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff]
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mpeg-4, com.apple.quicktime-movie]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.snappilot.mac
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GHU37F9N5L
        CODE_SIGN_ENTITLEMENTS: App/Snappilot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Snappilot
        INFOPLIST_KEY_NSHumanReadableCopyright: "Open source — MIT"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record your narration into screen recordings."
        INFOPLIST_KEY_NSCameraUsageDescription: "Show your webcam as an overlay in screen recordings."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribe your meeting recordings on-device to create notes and action items."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Add your meeting action items to Apple Reminders."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Add your meeting action items to Apple Reminders."
        ENABLE_HARDENED_RUNTIME: YES
